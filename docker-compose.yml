services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: dayflow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "${DAYFLOW_DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dayflow"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - dayflow-postgres-v17:/var/lib/postgresql/data

volumes:
  dayflow-postgres-v17:
