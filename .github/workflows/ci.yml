name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dayflow_ci
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/dayflow_ci
      JWT_ACCESS_SECRET: ci-access-secret-replace-in-deployment-0001
      JWT_REFRESH_SECRET: ci-refresh-secret-replace-in-deployment-0001
      DATA_ENCRYPTION_KEY: ci-encryption-secret-replace-in-deployment-0001
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: dayflow_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dayflow_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:validate
      - run: npm run db:generate
      - run: npm run db:migrate:deploy
      - run: npm run db:migrate:drift
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:e2e
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=critical
